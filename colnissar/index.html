  :root{
    --bg: #fbfaf7;
    --ink: #121212;
    --muted: #6b6b6b;
    --cta-bg: #D9D9D9;
    --cta-bg-hover: #C8C8C8;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    font-family: 'Suisse Intl', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.005em;
  }

  .stage{
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  /* ===== TOP BAR ===== */
  .topbar{
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 30px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
  }
  .topbar-group{
    display: flex;
    align-items: center;
    gap: 22px;
    font-size: 13px;
    color: var(--muted);
  }
  .partner-logo svg{
    height: 24px;
    width: auto;
    display: block;
  }
  .partner-logo.hig svg{ height: 28px; }
  .partner-logo.altilia svg{ height: 22px; }

  /* ===== PHASE 1 — claim + libro ===== */
  .phase1{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 26px;
    white-space: nowrap;
    opacity: 0;
  }
  .claim-line{
    font-size: clamp(22px, 2.4vw, 30px);
    font-weight: 400;
    letter-spacing: -0.01em;
    color: var(--ink);
    line-height: 1.2;
  }

  /* ----- vertical slide word mask ----- */
  .word-slot{
    position: relative;
    display: inline-block;
    overflow: hidden;
    height: 1.25em;
    width: 150px;       /* sovrascritto da JS */
    vertical-align: baseline;
    line-height: 1.25;
  }
  .words-stack{
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    will-change: transform;
  }
  .word{
    display: block;
    height: 1.25em;
    line-height: 1.25;
    font-family: 'Suisse Works', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.08em;
    white-space: nowrap;
    text-align: center;
  }

  /* ----- libro accanto ----- */
  .book-inline{
    width: 56px;
    height: 56px;
    position: relative;
    opacity: 0;
  }
  .book-svg{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    will-change: transform, opacity;
  }
  .book-svg.visible{ opacity: 1; }
  .book-svg svg{
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* ===== MARK-STAGE — 4 petali animati + full mark ===== */
  .mark-stage{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 260px;
    height: 260px;
    opacity: 0;
    pointer-events: none;
  }
  .mark-stage svg{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  /* split mark: i petali sono gruppi animati */
  #markSplit .petal{
    transform-origin: 155px 155px;
    will-change: transform, opacity;
  }
  /* full mark: sostituisce la versione split a fine animazione */
  #markFull{ opacity: 0; }

  /* ===== FINAL SCENE ===== */
  .final-scene{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 120px 24px 80px;
    opacity: 0;
    pointer-events: none;
  }
  .final-scene.active{ pointer-events: auto; }

  .final-countdown{
    display: flex;
    gap: 28px;
    opacity: 0;
  }
  .cd-block{
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 60px;
  }
  .cd-num{
    font-family: 'Suisse Works', serif;
    font-size: 32px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .cd-label{
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--muted);
    margin-top: 8px;
  }

  .final-logo{
    display: flex;
    align-items: center;
    gap: 28px;
    opacity: 0;
  }
  .final-logo .mark{
    width: 110px;
    height: 110px;
    flex-shrink: 0;
  }
  .final-logo .mark svg{ width:100%; height:100%; overflow: visible; }
  .final-logo .wordmark{
    font-family: 'Suisse Works', serif;
    font-weight: 400;
    font-size: clamp(60px, 8vw, 108px);
    line-height: 1;
    letter-spacing: -0.025em;
    color: var(--ink);
    opacity: 0;
    white-space: nowrap;
    overflow: hidden;
  }

  .final-claim{
    font-size: clamp(18px, 2vw, 26px);
    font-weight: 400;
    letter-spacing: -0.01em;
    opacity: 0;
  }
  .final-claim em{
    font-family: 'Suisse Works', serif;
    font-style: italic;
    font-weight: 400;
  }

  .cta{
    display: inline-block;
    padding: 16px 44px;
    background: var(--cta-bg);
    color: var(--ink);
    border-radius: 40px;
    text-decoration: none;
    font-family: 'Suisse Intl', sans-serif;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0;
    opacity: 0;
    pointer-events: auto;
    transition: background .3s cubic-bezier(.2,.7,.2,1), transform .3s cubic-bezier(.2,.7,.2,1);
  }
  .cta:hover{
    background: var(--cta-bg-hover);
    transform: translateY(-1px);
  }

  .skip{
    position: absolute;
    bottom: 24px;
    right: 28px;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity .3s;
    z-index: 50;
    background: none;
    border: none;
    font-family: inherit;
    font-weight: 500;
  }
  .skip:hover{ opacity: 1; }

  .grain{
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.03;
    mix-blend-mode: multiply;
    z-index: 100;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  @media (max-width: 640px){
    .topbar{ padding: 16px; flex-direction: column; gap: 14px; align-items: flex-start; }
    .topbar-group{ gap: 14px; }
    .phase1{ gap: 16px; }
    .final-logo{ flex-direction: column; gap: 16px; }
    .final-logo .mark{ width: 72px; height: 72px; }
    .final-countdown{ gap: 14px; }
    .cd-block{ min-width: 52px; }
    .cd-num{ font-size: 24px; }
    .mark-stage{ width: 200px; height: 200px; }
  }
</style>
</head>

  document.getElementById('cd-d').textContent = pad(d,3);
  document.getElementById('cd-h').textContent = pad(h);
  document.getElementById('cd-m').textContent = pad(m);
  document.getElementById('cd-s').textContent = pad(s);
}
tickCountdown();
setInterval(tickCountdown, 1000);

document.fonts.ready.then(() => runAnimation());

function runAnimation(){
  const words = gsap.utils.toArray('.word');
  const books = gsap.utils.toArray('#bookInline .book-svg');
  const wordSlot = document.getElementById('wordSlot');
  const wordsStack = document.getElementById('wordsStack');

  /* ----- misuro width e height delle parole nel font loaded ----- */
  const measurer = document.createElement('span');
  const cs = getComputedStyle(words[0]);
  measurer.style.cssText =
    'position:absolute;visibility:hidden;white-space:nowrap;' +
    'font-family:' + cs.fontFamily + ';font-style:italic;' +
    'font-weight:' + cs.fontWeight + ';font-size:' + cs.fontSize + ';' +
    'line-height:' + cs.lineHeight + ';letter-spacing:' + cs.letterSpacing + ';';
  document.body.appendChild(measurer);
  const wordWidths = words.map(w => {
    measurer.textContent = w.textContent;
    return Math.ceil(measurer.offsetWidth) + 4;
  });
  measurer.remove();

  /* altezza di una parola (serve per scorrimento verticale) */
  const wordHeight = words[0].offsetHeight;

  /* width iniziale */
  wordSlot.style.width = wordWidths[0] + 'px';

  /* ----- stato iniziale ----- */
  gsap.set(wordsStack, { y: 0 });
  gsap.set(books, { opacity: 0 });
  gsap.set(books[0], { opacity: 1 });
  gsap.set('#bookInline', { opacity: 0 });
  gsap.set('#phase1', { opacity: 0 });

  /* petali: partono da fuori schermo in direzioni diverse */
  const petals = gsap.utils.toArray('#markSplit .petal');
  /* posizioni iniziali "organiche" — ispirate al video reference */
  const petalStart = [
    { x:  520, y: -340, rotation:  -75, scale: 0.7 },  // right petal entra da alto-destra
    { x: -100, y: -580, rotation:   55, scale: 0.8 },  // top petal entra da alto
    { x: -560, y:  -80, rotation:  135, scale: 0.75 }, // left petal entra da sinistra
    { x:  240, y:  540, rotation: -110, scale: 0.85 }  // bottom petal entra da basso-destra
  ];
  petals.forEach((p, i) => {
    gsap.set(p, {
      transformOrigin: '155px 155px',
      xPercent: 0, yPercent: 0,
      ...petalStart[i],
      opacity: 0
    });
  });

  gsap.set('#markStage', { opacity: 0 });
  gsap.set('#markFull', { opacity: 0 });
  gsap.set('#finalScene', { opacity: 0 });
  gsap.set('#finalLogo', { opacity: 0 });
  gsap.set('#finalMark', { scale: 1.5 });
  gsap.set('#wordmark', { opacity: 0, clipPath: 'inset(0 100% 0 0)' });
  gsap.set('#countdown', { opacity: 0, y: -8 });
  gsap.set('#finalClaim', { opacity: 0, y: 8 });
  gsap.set('#cta', { opacity: 0, y: 8 });
  gsap.set('#topbar', { opacity: 0, y: -10 });

  const easeSoft   = "power2.inOut";
  const easeReveal = "power3.out";
  const tl = gsap.timeline({ defaults: { ease: easeSoft } });

  /* ===== PHASE 1: ingresso claim + primo libro ===== */
  tl.to('#phase1', { opacity: 1, duration: 0.6, ease: easeReveal }, 0.25);
  tl.to('#bookInline', { opacity: 1, duration: 0.7, ease: easeReveal }, 0.45);

  /* ===== ROTAZIONE PAROLE (vertical slide) + SWAP LIBRO (fade veloce sincronizzato) ===== */
  const HOLD = 1.3;
  const SLIDE = 0.75;
  let t = 0.25 + 0.6;  /* dopo l'ingresso del claim */

  /* prima parola già visibile, aspetto e poi comincio a slidare */
  for (let i = 1; i < words.length; i++){
    t += HOLD;

    /* vertical slide: words-stack scorre verso l'alto */
    tl.to(wordsStack, {
      y: -i * wordHeight,
      duration: SLIDE,
      ease: "power3.inOut"
    }, t);

    /* width del slot si anima verso la nuova parola */
    tl.to(wordSlot, {
      width: wordWidths[i],
      duration: SLIDE,
      ease: "power3.inOut"
    }, t);

    /* libro: swap con crossfade molto rapido + sottile scale pulse */
    tl.to(books[i-1], { opacity: 0, scale: 0.92, duration: SLIDE*0.45, ease: "power2.in" }, t);
    tl.fromTo(books[i],
      { opacity: 0, scale: 1.12 },
      { opacity: 1, scale: 1, duration: SLIDE*0.65, ease: "power2.out" },
      t + SLIDE*0.35);

    t += SLIDE;
  }

  /* hold sull'ultima parola */
  t += HOLD * 0.8;

  /* ===== PHASE 2: claim fade, scena prepara marchio ===== */
  tl.to('#phase1', { opacity: 0, duration: 0.55, ease: easeSoft }, t);
  t += 0.45;

  /* ===== PHASE 3: i 4 petali volano in scena (motion organico) ===== */
  tl.to('#markStage', { opacity: 1, duration: 0.3 }, t);

  /* ciascun petalo arriva al centro (x:0, y:0, rotation:0, scale:1)
     con durate e delay leggermente diversi per effetto organico */
  const petalDurations = [1.35, 1.2, 1.45, 1.3];
  const petalDelays =    [0.00, 0.10, 0.22, 0.35];
  const petalEases = [
    "power3.out",
    "power2.inOut",
    "power3.out",
    "power2.inOut"
  ];
  petals.forEach((p, i) => {
    tl.to(p, {
      x: 0,
      y: 0,
      rotation: 0,
      scale: 1,
      opacity: 1,
      duration: petalDurations[i],
      ease: petalEases[i]
    }, t + petalDelays[i]);
  });

  /* sovrapposto: ~alla fine dell'animazione petali, mark-full subentra
     con crossfade rapido per uniformare pixel-perfect */
  const petalEnd = t + Math.max(...petalDelays.map((d, i) => d + petalDurations[i]));
  tl.to('#markFull', { opacity: 1, duration: 0.25 }, petalEnd - 0.2);
  tl.to('#markSplit', { opacity: 0, duration: 0.25 }, petalEnd - 0.2);

  t = petalEnd + 0.4;

  /* ===== PHASE 4: il marchio si rimpicciolisce, va a sinistra, appare Colnissar ===== */
  tl.to('#finalScene', { opacity: 1, duration: 0.1 }, t);
  tl.set('#finalScene', { className: 'final-scene active' }, t);
  tl.to('#markStage', { opacity: 0, duration: 0.4, ease: easeSoft }, t);
  tl.to('#finalLogo', { opacity: 1, duration: 0.5, ease: easeReveal }, t);
  tl.to('#finalMark', { scale: 1, duration: 0.8, ease: easeSoft }, t);

  tl.to('#wordmark', {
    opacity: 1,
    clipPath: 'inset(0 0% 0 0)',
    duration: 1.1,
    ease: "power3.inOut"
  }, t + 0.7);

  t += 1.6;

  /* ===== PHASE 5: countdown, claim, CTA, topbar ===== */
  tl.to('#topbar', { opacity: 1, y: 0, duration: 0.9, ease: easeReveal }, t);
  tl.to('#countdown', { opacity: 1, y: 0, duration: 0.7, ease: easeReveal }, t + 0.05);
  tl.to('#finalClaim', { opacity: 1, y: 0, duration: 0.7, ease: easeReveal }, t + 0.3);
  tl.to('#cta', { opacity: 1, y: 0, duration: 0.7, ease: easeReveal }, t + 0.55);

  document.getElementById('skip').addEventListener('click', () => tl.progress(1));
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) tl.progress(1);
}
</script>
