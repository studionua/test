<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Rêverie · quattro movimenti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: #06060c;
      color: #f0f0f8;
      font-family: 'Inter', sans-serif;
      cursor: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
    }

    /* Custom cursor */
    .cursor {
      position: fixed;
      top: 0; left: 0;
      width: 14px; height: 14px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: width 0.25s, height 0.25s, border-color 0.25s;
      mix-blend-mode: difference;
      z-index: 100;
    }
    .cursor::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 2px; height: 2px;
      background: #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    /* Overlays */
    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* Intro */
    .intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .intro .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.7em;
      text-transform: uppercase;
      opacity: 0.5;
      margin-bottom: 2rem;
      padding-left: 0.7em;
    }

    .intro h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3.5rem, 11vw, 8rem);
      letter-spacing: 0.02em;
      line-height: 1;
      margin-bottom: 1.5rem;
    }

    .intro .sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1rem, 2vw, 1.4rem);
      opacity: 0.7;
      max-width: 480px;
    }

    /* Movement labels */
    .movement {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 8;
    }

    .movement .roman {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.75rem;
      letter-spacing: 0.6em;
      opacity: 0.55;
      margin-bottom: 1rem;
      padding-left: 0.6em;
    }

    .movement .title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(3rem, 9vw, 7rem);
      letter-spacing: 0.02em;
      line-height: 1;
      white-space: nowrap;
    }

    .movement {
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    /* Bottom credits */
    .credits {
      position: fixed;
      bottom: 24px;
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 32px;
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      opacity: 0.5;
      z-index: 20;
      pointer-events: none;
    }

    /* Side progress — elegant vertical line */
    .progress-rail {
      position: fixed;
      top: 50%;
      right: 24px;
      transform: translateY(-50%);
      width: 1px;
      height: 180px;
      background: rgba(255, 255, 255, 0.1);
      z-index: 30;
    }

    .progress-rail::after {
      content: "";
      position: absolute;
      left: -1px;
      top: 0;
      width: 3px;
      height: var(--p, 0%);
      background: linear-gradient(to bottom, #fff, rgba(255,255,255,0.4));
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    .progress-dots {
      position: fixed;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 58px;
      z-index: 30;
      pointer-events: none;
    }

    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid transparent;
      margin-left: 8px;
      transition: background 0.4s, transform 0.4s;
    }
    .dot.active {
      background: #fff;
      transform: scale(1.6);
    }

    /* Hint */
    .hint {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      opacity: 0.4;
      transition: opacity 0.6s;
      pointer-events: none;
      z-index: 20;
    }
    .hint.hidden { opacity: 0; }

    .hint::after {
      content: "↓";
      display: inline-block;
      margin-left: 0.8em;
      animation: drift 2s ease-in-out infinite;
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0); opacity: 0.6; }
      50%      { transform: translateY(4px); opacity: 1; }
    }

    .restart {
      position: fixed;
      top: 24px;
      right: 40px;
      padding: 10px 20px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      cursor: none;
      opacity: 0;
      transition: opacity 0.6s, background 0.3s;
      z-index: 40;
      pointer-events: none;
    }
    .restart.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .restart:hover { background: rgba(255, 255, 255, 0.08); }

    .intro.hidden { opacity: 0; transform: scale(0.98); }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="cursor" id="cursor"></div>

  <div class="overlay">
    <div class="intro" id="intro">
      <div class="eyebrow">Opus 01</div>
      <h1>Rêverie</h1>
      <div class="sub">un'esperienza astratta in quattro movimenti</div>
    </div>

    <div class="movement" id="mov1">
      <div class="roman">I</div>
      <div class="title">Origine</div>
    </div>
    <div class="movement" id="mov2">
      <div class="roman">II</div>
      <div class="title">Risveglio</div>
    </div>
    <div class="movement" id="mov3">
      <div class="roman">III</div>
      <div class="title">Tempesta</div>
    </div>
    <div class="movement" id="mov4">
      <div class="roman">IV</div>
      <div class="title">Armonia</div>
    </div>
  </div>

  <div class="progress-rail" id="progressRail"></div>
  <div class="progress-dots" id="progressDots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="credits">
    <span>Rêverie</span>
    <span>Opus 01</span>
  </div>

  <div class="hint" id="hint">Scorri per iniziare</div>
  <button class="restart" id="restart">Ricomincia</button>

  <script>
    /* =========================================================
       Rêverie — a generative abstract scroll-driven visual piece
       ========================================================= */

    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');

    let W, H, CX, CY, DPR;

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      CX = W / 2;
      CY = H / 2;
      canvas.width  = W * DPR;
      canvas.height = H * DPR;
      canvas.style.width  = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    /* ---------- Utilities ---------- */
    const TAU = Math.PI * 2;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const range = (p, s, e) => clamp((p - s) / (e - s), 0, 1);
    const lerp  = (a, b, t) => a + (b - a) * t;

    function hsla(h, s, l, a) {
      return `hsla(${h},${s}%,${l}%,${a})`;
    }

    /* Layered sinusoidal noise — cheap, smooth, and organic */
    function flowNoise(x, y, t) {
      const s = 0.0025;
      return (
        Math.sin(x * s + t * 0.6) * Math.cos(y * s - t * 0.4) +
        Math.sin((x + y) * s * 0.6 + t * 0.8) * 0.6 +
        Math.cos((x - y) * s * 1.3 + t * 0.3) * 0.4
      );
    }

    /* ---------- Color palettes per movement ---------- */
    const palettes = [
      { hue: 230, hue2: 270, sat: 70, name: 'origine'  },
      { hue: 190, hue2: 160, sat: 75, name: 'risveglio'},
      { hue:  10, hue2: 330, sat: 90, name: 'tempesta' },
      { hue:  45, hue2:  15, sat: 60, name: 'armonia'  }
    ];

    function paletteAt(p) {
      const seg = clamp(p * 3, 0, 2.9999);
      const i   = Math.floor(seg);
      const t   = seg - i;
      const a = palettes[i];
      const b = palettes[Math.min(i + 1, 3)];
      return {
        hue:  lerp(a.hue,  b.hue,  t),
        hue2: lerp(a.hue2, b.hue2, t),
        sat:  lerp(a.sat,  b.sat,  t)
      };
    }

    /* ---------- Particles ---------- */
    const PARTICLE_COUNT = Math.min(2200, Math.floor(W * H / 700));
    const particles = [];

    class Particle {
      constructor() { this.reset(true); }

      reset(initial = false) {
        this.x  = Math.random() * W;
        this.y  = Math.random() * H;
        this.px = this.x;
        this.py = this.y;
        this.vx = 0;
        this.vy = 0;
        this.life    = initial ? Math.random() * 180 : 0;
        this.maxLife = 180 + Math.random() * 220;
        this.seed    = Math.random();
      }

      update(p, mx, my, t) {
        /* Flow field angle scales and shifts per movement */
        const fieldScale = 2 + p * 4;
        const angle = flowNoise(this.x, this.y, t * (0.3 + p * 0.9)) * Math.PI * fieldScale;

        const speed = 0.4 + p * 1.3;
        this.vx += Math.cos(angle) * speed * 0.25;
        this.vy += Math.sin(angle) * speed * 0.25;

        /* Radial pull toward center — strong at origin, relaxed later */
        const dx = CX - this.x;
        const dy = CY - this.y;
        const d  = Math.hypot(dx, dy) + 1;
        const pull = (0.025 * (1 - p * 0.6)) - 0.004 * p;
        this.vx += (dx / d) * pull;
        this.vy += (dy / d) * pull;

        /* Orbital swirl — increases in tempesta, resolves in armonia */
        const swirl = (0.015 + p * 0.08) * (p < 0.85 ? 1 : 1 - (p - 0.85) * 4);
        this.vx += (-dy / d) * swirl;
        this.vy += ( dx / d) * swirl;

        /* Mouse interaction — attractor early, repulsor in tempesta */
        if (mx !== null) {
          const mdx = mx - this.x;
          const mdy = my - this.y;
          const md2 = mdx * mdx + mdy * mdy;
          if (md2 < 40000) {
            const mdist = Math.sqrt(md2) + 1;
            const dir   = (p > 0.55 && p < 0.8) ? -1 : 1;
            const force = (1 - mdist / 200) * 0.9 * dir;
            this.vx += (mdx / mdist) * force;
            this.vy += (mdy / mdist) * force;
          }
        }

        /* Damping */
        const damp = 0.92 - p * 0.04;
        this.vx *= damp;
        this.vy *= damp;

        this.px = this.x;
        this.py = this.y;
        this.x += this.vx;
        this.y += this.vy;

        this.life++;
        if (
          this.life > this.maxLife ||
          this.x < -20 || this.x > W + 20 ||
          this.y < -20 || this.y > H + 20
        ) {
          this.reset();
        }
      }

      draw(pal, p) {
        const lifeT  = 1 - this.life / this.maxLife;
        const alpha  = Math.sin(lifeT * Math.PI) * (0.35 + p * 0.25);
        const hueMix = lerp(pal.hue, pal.hue2, this.seed);
        const light  = 55 + this.seed * 20;

        ctx.strokeStyle = hsla(hueMix, pal.sat, light, alpha);
        ctx.lineWidth   = 0.8 + this.seed * 0.9;
        ctx.beginPath();
        ctx.moveTo(this.px, this.py);
        ctx.lineTo(this.x,  this.y);
        ctx.stroke();
      }
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

    /* ---------- Central morphing form ---------- */
    function drawForm(p, t, pal) {
      const phaseBreath = Math.sin(t * 0.8) * 0.5 + 0.5;
      const baseR = Math.min(W, H) * (0.06 + p * 0.22);
      const points = 3 + Math.floor(p * 9);            /* 3 → 12 vertices */
      const spike  = 0.1 + Math.abs(Math.sin(p * Math.PI * 1.5)) * 0.6;
      const rot    = t * (0.2 + p * 0.6);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(CX, CY);
      ctx.rotate(rot);

      for (let layer = 0; layer < 3; layer++) {
        const layerScale = 1 + layer * 0.25;
        const alpha = (0.12 - layer * 0.03) * (0.7 + phaseBreath * 0.3);
        ctx.beginPath();
        for (let i = 0; i <= points; i++) {
          const a = (i / points) * TAU;
          const s = 1 + Math.sin(a * points + t * 1.5) * spike;
          const r = baseR * layerScale * s * (0.9 + phaseBreath * 0.2);
          const x = Math.cos(a) * r;
          const y = Math.sin(a) * r;
          if (i === 0) ctx.moveTo(x, y);
          else         ctx.lineTo(x, y);
        }
        ctx.closePath();

        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, baseR * layerScale * 1.5);
        grad.addColorStop(0, hsla(pal.hue,  pal.sat, 65, alpha * 2));
        grad.addColorStop(1, hsla(pal.hue2, pal.sat, 45, 0));
        ctx.fillStyle = grad;
        ctx.fill();
      }

      /* Core ring */
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = hsla(pal.hue, pal.sat, 80, 0.6 + phaseBreath * 0.25);
      ctx.beginPath();
      for (let i = 0; i <= points; i++) {
        const a = (i / points) * TAU;
        const s = 1 + Math.sin(a * points + t * 1.5) * spike;
        const r = baseR * s;
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y);
        else         ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();

      /* Center point */
      ctx.fillStyle = hsla(pal.hue, pal.sat, 95, 0.9);
      ctx.beginPath();
      ctx.arc(0, 0, 3 + phaseBreath * 2, 0, TAU);
      ctx.fill();

      ctx.restore();
    }

    /* ---------- Vignette ---------- */
    function drawVignette() {
      const g = ctx.createRadialGradient(CX, CY, Math.min(W, H) * 0.25, CX, CY, Math.max(W, H) * 0.75);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.55)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    /* ---------- Scroll progress (virtual) ---------- */
    let target  = 0;
    let current = 0;
    let mouseX  = null;
    let mouseY  = null;
    let smoothMX = null;
    let smoothMY = null;

    const intro        = document.getElementById('intro');
    const hint         = document.getElementById('hint');
    const restartBtn   = document.getElementById('restart');
    const progressRail = document.getElementById('progressRail');
    const dots         = document.querySelectorAll('#progressDots .dot');
    const movements    = [
      document.getElementById('mov1'),
      document.getElementById('mov2'),
      document.getElementById('mov3'),
      document.getElementById('mov4')
    ];
    const cursor = document.getElementById('cursor');

    function updateOverlay(p) {
      intro.classList.toggle('hidden', p > 0.02);
      hint.classList.toggle('hidden', p > 0.02);
      restartBtn.classList.toggle('visible', p > 0.97);

      progressRail.style.setProperty('--p', (p * 100) + '%');

      /* Movement labels: show near each quadrant's midpoint */
      const centers = [0.12, 0.38, 0.62, 0.88];
      movements.forEach((el, i) => {
        const dist = Math.abs(p - centers[i]);
        const vis  = dist < 0.09 ? 1 - dist / 0.09 : 0;
        el.style.opacity = vis.toFixed(3);
        const ty = (1 - vis) * 20;
        el.style.transform = `translate(-50%, calc(-50% + ${ty}px))`;
      });

      const active = Math.min(3, Math.floor(p * 4));
      dots.forEach((d, i) => d.classList.toggle('active', i === active));
    }

    /* ---------- Main loop ---------- */
    let t0 = performance.now();
    function frame(now) {
      const t = (now - t0) * 0.001;

      /* Smooth progress */
      current += (target - current) * 0.06;

      /* Smooth mouse for organic feel */
      if (mouseX !== null) {
        if (smoothMX === null) { smoothMX = mouseX; smoothMY = mouseY; }
        smoothMX += (mouseX - smoothMX) * 0.15;
        smoothMY += (mouseY - smoothMY) * 0.15;
      }

      /* Fade previous frame for motion trails */
      const fadeAlpha = 0.06 + current * 0.04;
      ctx.fillStyle = `rgba(6, 6, 12, ${fadeAlpha})`;
      ctx.fillRect(0, 0, W, H);

      const pal = paletteAt(current);

      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < particles.length; i++) {
        const pt = particles[i];
        pt.update(current, smoothMX, smoothMY, t);
        pt.draw(pal, current);
      }
      ctx.globalCompositeOperation = 'source-over';

      drawForm(current, t, pal);
      drawVignette();

      updateOverlay(current);

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    /* ---------- Input ---------- */
    const WHEEL_SENS = 0.00055;
    const TOUCH_SENS = 0.002;
    const KEY_STEP   = 0.05;

    function setTarget(v) { target = clamp(v, 0, 1); }

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      setTarget(target + e.deltaY * WHEEL_SENS);
    }, { passive: false });

    let touchY = null;
    window.addEventListener('touchstart', (e) => {
      touchY = e.touches[0].clientY;
      mouseX = e.touches[0].clientX;
      mouseY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (touchY === null) return;
      e.preventDefault();
      const y = e.touches[0].clientY;
      setTarget(target + (touchY - y) * TOUCH_SENS);
      touchY = y;
      mouseX = e.touches[0].clientX;
      mouseY = e.touches[0].clientY;
    }, { passive: false });

    window.addEventListener('touchend', () => {
      touchY = null;
      mouseX = mouseY = null;
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (['ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); setTarget(target + KEY_STEP); }
      else if (['ArrowUp', 'PageUp'].includes(e.key))     { e.preventDefault(); setTarget(target - KEY_STEP); }
      else if (e.key === 'Home')                          { setTarget(0); }
      else if (e.key === 'End')                           { setTarget(1); }
    });

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    });

    window.addEventListener('mouseleave', () => {
      mouseX = mouseY = null;
      smoothMX = smoothMY = null;
    });

    restartBtn.addEventListener('click', () => setTarget(0));

    /* Prime the canvas with solid background */
    ctx.fillStyle = '#06060c';
    ctx.fillRect(0, 0, W, H);
  </script>
</body>
</html>
