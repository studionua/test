<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notte di Natale · scroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      height: 800vh;
      background: #05080f;
      font-family: 'Inter', sans-serif;
      color: #f5f5fa;
      overscroll-behavior: none;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 110%, #0e2438 0%, #060912 55%, #02030a 100%);
    }

    /* contenitore esterno: tutta la scena notturna che verrà "zoomata" */
    .exterior {
      position: absolute;
      inset: 0;
      transform-origin: 20% 78%;
      will-change: transform, opacity, filter;
    }

    /* stelle */
    .stars {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 18%, #fff, transparent 60%),
        radial-gradient(1px 1px at 25% 9%, #cfe6ff, transparent 60%),
        radial-gradient(1.5px 1.5px at 40% 22%, #fff, transparent 60%),
        radial-gradient(1px 1px at 58% 12%, #aac6ff, transparent 60%),
        radial-gradient(1px 1px at 71% 25%, #fff, transparent 60%),
        radial-gradient(1.5px 1.5px at 83% 8%, #fff, transparent 60%),
        radial-gradient(1px 1px at 92% 30%, #cfe6ff, transparent 60%),
        radial-gradient(1px 1px at 6% 35%, #fff, transparent 60%),
        radial-gradient(1px 1px at 33% 38%, #fff, transparent 60%),
        radial-gradient(1px 1px at 48% 5%, #fff, transparent 60%),
        radial-gradient(1px 1px at 64% 32%, #fff, transparent 60%);
      opacity: 0;
      animation: twinkle 4s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.6); }
    }

    /* luna */
    .moon {
      position: absolute;
      top: 12%;
      right: 14%;
      width: 110px; height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff8e0 0%, #ecd58a 60%, #b89a4a 100%);
      box-shadow: 0 0 60px rgba(255, 240, 180, 0.35), 0 0 120px rgba(255, 220, 150, 0.18);
      opacity: 0;
      transform: scale(0.6);
    }

    /* terreno */
    .ground {
      position: absolute;
      bottom: -40px;
      left: -10%;
      width: 120%;
      height: 38%;
      background:
        radial-gradient(ellipse at 50% 0%, #f4f7ff 0%, #d7dfee 60%, #aab6cb 100%);
      border-top-left-radius: 50% 80px;
      border-top-right-radius: 50% 110px;
      transform: translateY(100%);
    }

    /* colline */
    .hill {
      position: absolute;
      bottom: 28%;
      width: 60%;
      height: 18%;
      background: linear-gradient(180deg, #1a2c44 0%, #0c1726 100%);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      opacity: 0;
    }
    .hill.left  { left: -10%; }
    .hill.right { right: -15%; width: 65%; height: 22%; bottom: 28%; }

    /* albero */
    .tree {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%) scale(0);
      transform-origin: 50% 100%;
      width: 260px;
      height: 380px;
    }
    .tree .trunk {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 36px; height: 50px;
      background: linear-gradient(180deg, #5a3a20, #2e1b0d);
      border-radius: 4px;
    }
    .tree .layer {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: solid transparent;
      border-right: solid transparent;
      border-bottom: solid #1f5a2e;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
    }
    .tree .l1 { bottom: 230px; border-left-width: 70px;  border-right-width: 70px;  border-bottom-width: 110px; border-bottom-color: #1c5028; }
    .tree .l2 { bottom: 150px; border-left-width: 95px;  border-right-width: 95px;  border-bottom-width: 130px; border-bottom-color: #1f5a2e; }
    .tree .l3 { bottom:  50px; border-left-width: 125px; border-right-width: 125px; border-bottom-width: 150px; border-bottom-color: #235f33; }

    .bauble {
      position: absolute;
      width: 14px; height: 14px;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      box-shadow: 0 0 8px rgba(255,255,255,0.3);
    }
    .light {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      opacity: 0;
    }

    .star {
      position: absolute;
      bottom: 360px;
      left: 50%;
      transform: translate(-50%, -50%) scale(0) rotate(0deg);
      width: 36px; height: 36px;
      background: #ffe27a;
      clip-path: polygon(
        50% 0%, 61% 35%, 98% 35%, 68% 57%,
        79% 91%, 50% 70%, 21% 91%, 32% 57%,
        2% 35%, 39% 35%
      );
      box-shadow: 0 0 25px #ffd766, 0 0 60px #ffae2a;
    }

    /* neve */
    .snow {
      position: absolute; inset: 0;
      pointer-events: none;
      opacity: 0;
    }
    .flake {
      position: absolute;
      top: -10px;
      color: #fff;
      font-size: 14px;
      opacity: 0.85;
      will-change: transform;
      animation: fall linear infinite;
      text-shadow: 0 0 4px rgba(255,255,255,0.6);
    }
    @keyframes fall {
      0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); }
      100% { transform: translate3d(20px, 110vh, 0) rotate(360deg); }
    }

    /* slitta */
    .sleigh {
      position: absolute;
      top: 22%;
      left: -25%;
      font-size: 56px;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5));
      transform: translateX(0);
      opacity: 0;
    }

    /* casetta */
    .house {
      position: absolute;
      bottom: 14%;
      left: 14%;
      width: 130px; height: 100px;
      opacity: 0;
      transform: translateY(20px);
    }
    .house .body {
      position: absolute;
      bottom: 0; left: 0;
      width: 130px; height: 70px;
      background: linear-gradient(180deg, #b15a3c 0%, #7a3a26 100%);
      border-radius: 4px;
    }
    .house .roof {
      position: absolute;
      top: 0; left: -10px;
      width: 0; height: 0;
      border-left: 75px solid transparent;
      border-right: 75px solid transparent;
      border-bottom: 50px solid #f4f7ff;
    }
    .house .window {
      position: absolute;
      bottom: 22px; left: 50%;
      transform: translateX(-50%);
      width: 28px; height: 28px;
      background: #ffd66b;
      border-radius: 4px;
      box-shadow: 0 0 18px rgba(255, 200, 100, 0.7);
    }
    .house .door {
      position: absolute;
      bottom: 0; left: 14px;
      width: 22px; height: 36px;
      background: linear-gradient(180deg, #4a2418 0%, #2a140b 100%);
      border-radius: 3px 3px 0 0;
      box-shadow: inset 0 0 0 1px rgba(255,200,120,0.15);
    }
    .house .chimney {
      position: absolute;
      top: 0; right: 18px;
      width: 16px; height: 32px;
      background: #4a2418;
    }

    /* INTERNO della casa: appare quando la "camera" entra */
    .interior {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 65%, #f4b86a 0%, #c97632 30%, #5a2a14 70%, #1a0a05 100%);
    }
    .interior::before {
      /* pavimento in legno */
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 32%;
      background:
        repeating-linear-gradient(90deg,
          #5a3520 0 60px, #6b3f26 60px 120px),
        linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.6));
      background-blend-mode: multiply;
      box-shadow: 0 -20px 60px rgba(0,0,0,0.6) inset;
    }
    .interior::after {
      /* parete con boiserie */
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 68%;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.5) 100%);
    }

    /* camino */
    .fireplace {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 220px;
    }
    .fireplace .mantel {
      position: absolute;
      top: 0; left: -16px;
      width: 272px; height: 18px;
      background: linear-gradient(180deg, #d8b07a, #8a6438);
      border-radius: 2px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    }
    .fireplace .stone {
      position: absolute;
      top: 18px; left: 0;
      width: 240px; height: 200px;
      background:
        repeating-linear-gradient(90deg,
          #6e6258 0 38px, #5a4f47 38px 76px),
        linear-gradient(180deg, #5a4f47, #3a312b);
      background-blend-mode: multiply;
      border-radius: 4px;
    }
    .fireplace .opening {
      position: absolute;
      top: 60px; left: 50%;
      transform: translateX(-50%);
      width: 140px; height: 130px;
      background: radial-gradient(ellipse at 50% 80%, #2a0a02 0%, #000 80%);
      border-radius: 8px 8px 4px 4px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
      overflow: hidden;
    }
    .flame {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px; height: 90px;
      background: radial-gradient(ellipse at 50% 100%, #fff3a0 0%, #ffb347 35%, #e2531a 65%, transparent 80%);
      border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
      filter: blur(2px);
      animation: flicker 1.4s ease-in-out infinite alternate;
      mix-blend-mode: screen;
    }
    .flame.f2 { width: 40px; height: 70px; opacity: 0.8; animation-duration: 1.1s; animation-delay: -0.4s; }
    .flame.f3 { width: 28px; height: 50px; opacity: 0.7; animation-duration: 0.8s; animation-delay: -0.7s; }
    @keyframes flicker {
      0%   { transform: translateX(-50%) scale(1, 1); }
      50%  { transform: translateX(-50%) scale(1.05, 1.1); }
      100% { transform: translateX(-50%) scale(0.95, 0.95); }
    }

    /* calze appese al camino */
    .stocking {
      position: absolute;
      top: 18px;
      width: 22px; height: 50px;
      background: #c0392b;
      border-radius: 4px 4px 12px 4px / 4px 4px 14px 4px;
      transform: rotate(-6deg);
      box-shadow: inset 0 4px 0 #fff;
    }
    .stocking.s1 { left: 30px; }
    .stocking.s2 { left: 70px; background: #2e8b57; transform: rotate(4deg); }
    .stocking.s3 { right: 30px; background: #c0392b; transform: rotate(6deg); }

    /* ghirlanda sul camino */
    .garland {
      position: absolute;
      top: 12px; left: -16px;
      width: 272px; height: 14px;
      background:
        radial-gradient(circle at 10px 7px, #1f5a2e 6px, transparent 7px) repeat-x,
        radial-gradient(circle at 22px 7px, #235f33 6px, transparent 7px) repeat-x;
      background-size: 28px 14px;
    }
    .garland::after {
      content: "";
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 14px 7px, #e74c3c 2px, transparent 3px) repeat-x,
        radial-gradient(circle at 28px 7px, #f1c40f 2px, transparent 3px) repeat-x;
      background-size: 28px 14px;
    }

    /* CTA finale */
    .cta-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }
    .cta-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(36px, 6vw, 72px);
      color: #fff;
      text-shadow: 0 0 24px rgba(255,180,100,0.7), 0 4px 30px rgba(0,0,0,0.6);
      transform: translateY(20px);
      transition: transform 0.6s ease;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 18px 38px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #2a140b;
      background: linear-gradient(180deg, #ffd66b 0%, #e9a73a 100%);
      border: none;
      border-radius: 40px;
      cursor: pointer;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.3) inset,
        0 8px 24px rgba(0,0,0,0.5),
        0 0 40px rgba(255, 180, 80, 0.5);
      transform: translateY(20px) scale(0.95);
      transition: transform 0.6s ease, box-shadow 0.3s ease;
    }
    .cta:hover {
      transform: translateY(20px) scale(1.04);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.4) inset,
        0 12px 32px rgba(0,0,0,0.55),
        0 0 60px rgba(255, 200, 110, 0.7);
    }
    .cta-wrap.show .cta-title,
    .cta-wrap.show .cta { transform: translateY(0) scale(1); }

    /* hint scroll */
    .hint {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      font-size: 12px; letter-spacing: 4px;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
      transition: opacity 0.4s ease;
      pointer-events: none;
      z-index: 10;
    }
    .hint::after {
      content: "";
      display: block;
      width: 1px; height: 36px;
      margin: 10px auto 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.6), transparent);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: translateY(0); opacity: 0.4; }
      50%     { transform: translateY(8px); opacity: 1; }
    }

    .progress {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #c0392b, #ffd66b, #2e8b57);
      z-index: 11;
    }
  </style>
</head>
<body>

  <div class="progress" id="progress"></div>
  <div class="hint" id="hint">scroll</div>

  <div class="stage">

    <!-- SCENA ESTERNA -->
    <div class="exterior" id="exterior">
      <div class="stars" id="stars"></div>
      <div class="moon" id="moon"></div>

      <div class="hill left"  id="hillL"></div>
      <div class="hill right" id="hillR"></div>

      <div class="snow" id="snow"></div>

      <div class="sleigh" id="sleigh">🎅🛷</div>

      <div class="ground" id="ground"></div>

      <div class="house" id="house">
        <div class="roof"></div>
        <div class="chimney"></div>
        <div class="body"></div>
        <div class="window"></div>
        <div class="door"></div>
      </div>

      <div class="tree" id="tree">
        <div class="layer l3"></div>
        <div class="layer l2"></div>
        <div class="layer l1"></div>
        <div class="trunk"></div>
        <div class="star" id="star"></div>
      </div>
    </div>

    <!-- INTERNO della casa -->
    <div class="interior" id="interior">
      <div class="fireplace">
        <div class="mantel"></div>
        <div class="garland"></div>
        <div class="stocking s1"></div>
        <div class="stocking s2"></div>
        <div class="stocking s3"></div>
        <div class="stone"></div>
        <div class="opening">
          <div class="flame"></div>
          <div class="flame f2"></div>
          <div class="flame f3"></div>
        </div>
      </div>
    </div>

    <!-- CTA -->
    <div class="cta-wrap" id="ctaWrap">
      <div class="cta-title">Benvenuto</div>
      <button class="cta" type="button">Verifica disponibilità</button>
    </div>

  </div>

<script>
(() => {
  const exterior = document.getElementById('exterior');
  const interior = document.getElementById('interior');
  const ctaWrap  = document.getElementById('ctaWrap');

  const tree    = document.getElementById('tree');
  const star    = document.getElementById('star');
  const stars   = document.getElementById('stars');
  const moon    = document.getElementById('moon');
  const ground  = document.getElementById('ground');
  const hillL   = document.getElementById('hillL');
  const hillR   = document.getElementById('hillR');
  const snow    = document.getElementById('snow');
  const sleigh  = document.getElementById('sleigh');
  const house   = document.getElementById('house');
  const hint    = document.getElementById('hint');
  const progress= document.getElementById('progress');

  // fiocchi di neve
  const flakeChars = ['❄', '❅', '❆', '✻', '·'];
  for (let i = 0; i < 70; i++) {
    const f = document.createElement('span');
    f.className = 'flake';
    f.textContent = flakeChars[Math.floor(Math.random() * flakeChars.length)];
    f.style.left = (Math.random() * 100) + '%';
    f.style.fontSize = (8 + Math.random() * 16) + 'px';
    f.style.opacity = (0.4 + Math.random() * 0.6).toString();
    const dur = 6 + Math.random() * 10;
    f.style.animationDuration = dur + 's';
    f.style.animationDelay = (-Math.random() * dur) + 's';
    snow.appendChild(f);
  }

  // baubles e luci
  const baubleColors = ['#e74c3c', '#f1c40f', '#ecf0f1', '#9b59b6', '#3498db'];
  const lightColors  = ['#ffeb99', '#ff8a8a', '#9be3a3', '#a3c8ff', '#ffc78a'];

  const baublePositions = [
    [130, 110], [90, 145], [170, 145], [60, 180], [200, 180],
    [110, 215], [150, 215], [85, 250], [175, 250],
    [100, 290], [160, 290], [130, 320]
  ];
  const lightPositions = [
    [70, 130], [190, 130], [50, 175], [210, 175],
    [40, 230], [220, 230], [70, 270], [190, 270],
    [110, 80], [150, 80]
  ];

  const baubles = baublePositions.map(([x, y], i) => {
    const b = document.createElement('div');
    b.className = 'bauble';
    b.style.left = x + 'px';
    b.style.top  = y + 'px';
    b.style.background = baubleColors[i % baubleColors.length];
    b.dataset.delay = (i / baublePositions.length).toFixed(3);
    tree.appendChild(b);
    return b;
  });

  const lights = lightPositions.map(([x, y], i) => {
    const l = document.createElement('div');
    l.className = 'light';
    l.style.left = x + 'px';
    l.style.top  = y + 'px';
    l.style.background = lightColors[i % lightColors.length];
    l.style.boxShadow = `0 0 12px ${lightColors[i % lightColors.length]}, 0 0 24px ${lightColors[i % lightColors.length]}`;
    l.dataset.delay = (i / lightPositions.length).toFixed(3);
    tree.appendChild(l);
    return l;
  });

  const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
  const map   = (v, a, b) => clamp((v - a) / (b - a));
  const lerp  = (a, b, t) => a + (b - a) * t;

  function frame() {
    const max = document.body.scrollHeight - window.innerHeight;
    const p   = max > 0 ? window.scrollY / max : 0;
    progress.style.width = (p * 100) + '%';

    hint.style.opacity = p > 0.02 ? '0' : '1';

    // 0.00 - 0.07 stelle e luna
    const tStars = map(p, 0.00, 0.07);
    stars.style.opacity = tStars.toString();
    moon.style.opacity  = tStars.toString();
    moon.style.transform = `scale(${lerp(0.6, 1, tStars)})`;

    // 0.04 - 0.14 colline
    const tHills = map(p, 0.04, 0.14);
    hillL.style.opacity = tHills.toString();
    hillR.style.opacity = tHills.toString();
    hillL.style.transform = `translateY(${lerp(40, 0, tHills)}px)`;
    hillR.style.transform = `translateY(${lerp(50, 0, tHills)}px)`;

    // 0.08 - 0.18 terreno
    ground.style.transform = `translateY(${lerp(100, 0, map(p, 0.08, 0.18))}%)`;

    // 0.14 - 0.24 casetta
    const tHouse = map(p, 0.14, 0.24);
    house.style.opacity   = tHouse.toString();
    house.style.transform = `translateY(${lerp(20, 0, tHouse)}px)`;

    // 0.16 - 0.32 neve
    snow.style.opacity = map(p, 0.16, 0.32).toString();

    // 0.20 - 0.36 albero
    const tTree = map(p, 0.20, 0.36);
    const easeT = tTree * tTree * (3 - 2 * tTree);
    tree.style.transform = `translateX(-50%) scale(${easeT})`;

    // 0.36 - 0.50 baubles
    const tDeco = map(p, 0.36, 0.50);
    baubles.forEach(b => {
      const d = parseFloat(b.dataset.delay);
      const local = clamp((tDeco - d * 0.7) / 0.3);
      b.style.opacity = local.toString();
      b.style.transform = `scale(${lerp(0, 1, local)})`;
    });

    // 0.48 - 0.62 luci
    const tLights = map(p, 0.48, 0.62);
    lights.forEach(l => {
      const d = parseFloat(l.dataset.delay);
      const local = clamp((tLights - d * 0.6) / 0.4);
      const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 400 + d * 6);
      l.style.opacity = (local * pulse).toString();
    });

    // 0.58 - 0.70 stella
    const tStar = map(p, 0.58, 0.70);
    const easeS = tStar * tStar * (3 - 2 * tStar);
    star.style.transform =
      `translate(-50%, -50%) scale(${lerp(0, 1, easeS)}) rotate(${lerp(-180, 0, easeS)}deg)`;

    // 0.65 - 0.78 slitta
    const tSleigh = map(p, 0.65, 0.78);
    const arc = -Math.sin(tSleigh * Math.PI) * 60;
    sleigh.style.opacity   = (tSleigh > 0 && tSleigh < 1 ? 1 : 0).toString();
    sleigh.style.transform =
      `translate(${lerp(0, window.innerWidth * 1.5, tSleigh)}px, ${arc}px)`;

    // 0.78 - 0.92 ZOOM dentro la casa
    const tZoom = map(p, 0.78, 0.92);
    const easeZ = tZoom * tZoom * (3 - 2 * tZoom);
    const scale = lerp(1, 14, easeZ);
    // dopo lo scale rispetto a (20%, 78%), porto quel punto al centro viewport
    const tx = lerp(0, 30, easeZ); // vw
    const ty = lerp(0, -28, easeZ); // vh
    exterior.style.transform = `translate(${tx}vw, ${ty}vh) scale(${scale})`;
    exterior.style.filter    = `blur(${lerp(0, 6, easeZ)}px) brightness(${lerp(1, 1.4, easeZ)})`;
    exterior.style.opacity   = lerp(1, 0, clamp((tZoom - 0.6) / 0.4)).toString();

    // interno appare verso fine zoom
    interior.style.opacity = map(p, 0.86, 0.95).toString();

    // 0.94 - 1.00 CTA
    const tCta = map(p, 0.94, 1.00);
    ctaWrap.style.opacity = tCta.toString();
    if (tCta > 0.5) {
      ctaWrap.classList.add('show');
      ctaWrap.style.pointerEvents = 'auto';
    } else {
      ctaWrap.classList.remove('show');
      ctaWrap.style.pointerEvents = 'none';
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
