<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notte di Natale · scroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      height: 600vh;
      background: #05080f;
      font-family: 'Inter', sans-serif;
      color: #f5f5fa;
      overscroll-behavior: none;
    }

    /* il "palco" è fisso: la pagina scrolla, ma la scena resta in vista
       e si anima in base alla progressione dello scroll */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 110%, #0e2438 0%, #060912 55%, #02030a 100%);
    }

    /* stelle */
    .stars {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 18%, #fff, transparent 60%),
        radial-gradient(1px 1px at 25% 9%, #cfe6ff, transparent 60%),
        radial-gradient(1.5px 1.5px at 40% 22%, #fff, transparent 60%),
        radial-gradient(1px 1px at 58% 12%, #aac6ff, transparent 60%),
        radial-gradient(1px 1px at 71% 25%, #fff, transparent 60%),
        radial-gradient(1.5px 1.5px at 83% 8%, #fff, transparent 60%),
        radial-gradient(1px 1px at 92% 30%, #cfe6ff, transparent 60%),
        radial-gradient(1px 1px at 6% 35%, #fff, transparent 60%),
        radial-gradient(1px 1px at 33% 38%, #fff, transparent 60%),
        radial-gradient(1px 1px at 48% 5%, #fff, transparent 60%),
        radial-gradient(1px 1px at 64% 32%, #fff, transparent 60%);
      opacity: 0;
      animation: twinkle 4s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.6); }
    }

    /* luna */
    .moon {
      position: absolute;
      top: 12%;
      right: 14%;
      width: 110px; height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff8e0 0%, #ecd58a 60%, #b89a4a 100%);
      box-shadow: 0 0 60px rgba(255, 240, 180, 0.35), 0 0 120px rgba(255, 220, 150, 0.18);
      opacity: 0;
      transform: scale(0.6);
    }

    /* terreno innevato */
    .ground {
      position: absolute;
      bottom: -40px;
      left: -10%;
      width: 120%;
      height: 38%;
      background:
        radial-gradient(ellipse at 50% 0%, #f4f7ff 0%, #d7dfee 60%, #aab6cb 100%);
      border-top-left-radius: 50% 80px;
      border-top-right-radius: 50% 110px;
      transform: translateY(100%);
      box-shadow: 0 -20px 60px rgba(255,255,255,0.05) inset;
    }

    /* colline lontane */
    .hill {
      position: absolute;
      bottom: 28%;
      width: 60%;
      height: 18%;
      background: linear-gradient(180deg, #1a2c44 0%, #0c1726 100%);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      opacity: 0;
    }
    .hill.left  { left: -10%; }
    .hill.right { right: -15%; width: 65%; height: 22%; bottom: 28%; }

    /* albero */
    .tree {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%) scale(0);
      transform-origin: 50% 100%;
      width: 260px;
      height: 380px;
    }
    .tree .trunk {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 36px; height: 50px;
      background: linear-gradient(180deg, #5a3a20, #2e1b0d);
      border-radius: 4px;
    }
    .tree .layer {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: solid transparent;
      border-right: solid transparent;
      border-bottom: solid #1f5a2e;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
    }
    .tree .l1 { bottom: 230px; border-left-width: 70px;  border-right-width: 70px;  border-bottom-width: 110px; border-bottom-color: #1c5028; }
    .tree .l2 { bottom: 150px; border-left-width: 95px;  border-right-width: 95px;  border-bottom-width: 130px; border-bottom-color: #1f5a2e; }
    .tree .l3 { bottom:  50px; border-left-width: 125px; border-right-width: 125px; border-bottom-width: 150px; border-bottom-color: #235f33; }

    /* baubles & lights */
    .bauble {
      position: absolute;
      width: 14px; height: 14px;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      box-shadow: 0 0 8px rgba(255,255,255,0.3);
    }
    .light {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      opacity: 0;
    }

    /* stella in cima */
    .star {
      position: absolute;
      bottom: 360px;
      left: 50%;
      transform: translate(-50%, -50%) scale(0) rotate(0deg);
      width: 36px; height: 36px;
      background: #ffe27a;
      clip-path: polygon(
        50% 0%, 61% 35%, 98% 35%, 68% 57%,
        79% 91%, 50% 70%, 21% 91%, 32% 57%,
        2% 35%, 39% 35%
      );
      box-shadow: 0 0 25px #ffd766, 0 0 60px #ffae2a;
    }

    /* fiocchi di neve */
    .snow {
      position: absolute; inset: 0;
      pointer-events: none;
      opacity: 0;
    }
    .flake {
      position: absolute;
      top: -10px;
      color: #fff;
      font-size: 14px;
      opacity: 0.85;
      will-change: transform;
      animation: fall linear infinite;
      text-shadow: 0 0 4px rgba(255,255,255,0.6);
    }
    @keyframes fall {
      0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); }
      100% { transform: translate3d(20px, 110vh, 0) rotate(360deg); }
    }

    /* slitta */
    .sleigh {
      position: absolute;
      top: 22%;
      left: -25%;
      font-size: 56px;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5));
      transform: translateX(0);
      opacity: 0;
    }

    /* casetta */
    .house {
      position: absolute;
      bottom: 14%;
      left: 14%;
      width: 130px; height: 100px;
      opacity: 0;
      transform: translateY(20px);
    }
    .house .body {
      position: absolute;
      bottom: 0; left: 0;
      width: 130px; height: 70px;
      background: linear-gradient(180deg, #b15a3c 0%, #7a3a26 100%);
      border-radius: 4px;
    }
    .house .roof {
      position: absolute;
      top: 0; left: -10px;
      width: 0; height: 0;
      border-left: 75px solid transparent;
      border-right: 75px solid transparent;
      border-bottom: 50px solid #f4f7ff;
    }
    .house .window {
      position: absolute;
      bottom: 22px; left: 50%;
      transform: translateX(-50%);
      width: 28px; height: 28px;
      background: #ffd66b;
      border-radius: 4px;
      box-shadow: 0 0 18px rgba(255, 200, 100, 0.7);
    }
    .house .chimney {
      position: absolute;
      top: 0; right: 18px;
      width: 16px; height: 32px;
      background: #4a2418;
    }

    /* messaggio finale */
    .greet {
      position: absolute;
      left: 50%; top: 18%;
      transform: translate(-50%, 0) scale(0.9);
      font-family: 'Great Vibes', cursive;
      font-size: clamp(48px, 9vw, 120px);
      color: #fff;
      letter-spacing: 1px;
      opacity: 0;
      text-shadow: 0 0 20px rgba(255,210,150,0.6), 0 4px 30px rgba(0,0,0,0.5);
      white-space: nowrap;
    }

    /* hint scroll */
    .hint {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      font-size: 12px; letter-spacing: 4px;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
      transition: opacity 0.4s ease;
      pointer-events: none;
      z-index: 10;
    }
    .hint::after {
      content: "";
      display: block;
      width: 1px; height: 36px;
      margin: 10px auto 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.6), transparent);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: translateY(0); opacity: 0.4; }
      50%     { transform: translateY(8px); opacity: 1; }
    }

    /* progress bar */
    .progress {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #c0392b, #ffd66b, #2e8b57);
      z-index: 11;
    }
  </style>
</head>
<body>

  <div class="progress" id="progress"></div>
  <div class="hint" id="hint">scroll</div>

  <div class="stage">
    <div class="stars" id="stars"></div>
    <div class="moon" id="moon"></div>

    <div class="hill left"  id="hillL"></div>
    <div class="hill right" id="hillR"></div>

    <div class="snow" id="snow"></div>

    <div class="sleigh" id="sleigh">🎅🛷</div>

    <div class="ground" id="ground"></div>

    <div class="house" id="house">
      <div class="roof"></div>
      <div class="chimney"></div>
      <div class="body"></div>
      <div class="window"></div>
    </div>

    <div class="tree" id="tree">
      <div class="layer l3"></div>
      <div class="layer l2"></div>
      <div class="layer l1"></div>
      <div class="trunk"></div>
      <div class="star" id="star"></div>
    </div>

    <div class="greet" id="greet">Buon Natale</div>
  </div>

<script>
(() => {
  const tree    = document.getElementById('tree');
  const star    = document.getElementById('star');
  const stars   = document.getElementById('stars');
  const moon    = document.getElementById('moon');
  const ground  = document.getElementById('ground');
  const hillL   = document.getElementById('hillL');
  const hillR   = document.getElementById('hillR');
  const snow    = document.getElementById('snow');
  const sleigh  = document.getElementById('sleigh');
  const house   = document.getElementById('house');
  const greet   = document.getElementById('greet');
  const hint    = document.getElementById('hint');
  const progress= document.getElementById('progress');

  // genera fiocchi di neve
  const flakeChars = ['❄', '❅', '❆', '✻', '·'];
  for (let i = 0; i < 70; i++) {
    const f = document.createElement('span');
    f.className = 'flake';
    f.textContent = flakeChars[Math.floor(Math.random() * flakeChars.length)];
    f.style.left = (Math.random() * 100) + '%';
    f.style.fontSize = (8 + Math.random() * 16) + 'px';
    f.style.opacity = (0.4 + Math.random() * 0.6).toString();
    const dur = 6 + Math.random() * 10;
    f.style.animationDuration = dur + 's';
    f.style.animationDelay = (-Math.random() * dur) + 's';
    snow.appendChild(f);
  }

  // genera baubles e luci sull'albero in posizioni "stabili"
  const baubleColors = ['#e74c3c', '#f1c40f', '#ecf0f1', '#9b59b6', '#3498db'];
  const lightColors  = ['#ffeb99', '#ff8a8a', '#9be3a3', '#a3c8ff', '#ffc78a'];

  // posizioni relative all'albero (260x380)
  const baublePositions = [
    [130, 110], [90, 145], [170, 145], [60, 180], [200, 180],
    [110, 215], [150, 215], [85, 250], [175, 250],
    [100, 290], [160, 290], [130, 320]
  ];
  const lightPositions = [
    [70, 130], [190, 130], [50, 175], [210, 175],
    [40, 230], [220, 230], [70, 270], [190, 270],
    [110, 80], [150, 80]
  ];

  const baubles = baublePositions.map(([x, y], i) => {
    const b = document.createElement('div');
    b.className = 'bauble';
    b.style.left = x + 'px';
    b.style.top  = y + 'px';
    b.style.background = baubleColors[i % baubleColors.length];
    b.dataset.delay = (i / baublePositions.length).toFixed(3);
    tree.appendChild(b);
    return b;
  });

  const lights = lightPositions.map(([x, y], i) => {
    const l = document.createElement('div');
    l.className = 'light';
    l.style.left = x + 'px';
    l.style.top  = y + 'px';
    l.style.background = lightColors[i % lightColors.length];
    l.style.boxShadow = `0 0 12px ${lightColors[i % lightColors.length]}, 0 0 24px ${lightColors[i % lightColors.length]}`;
    l.dataset.delay = (i / lightPositions.length).toFixed(3);
    tree.appendChild(l);
    return l;
  });

  // utility
  const clamp  = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
  const map    = (v, a, b) => clamp((v - a) / (b - a));
  const lerp   = (a, b, t) => a + (b - a) * t;

  function frame() {
    const max = document.body.scrollHeight - window.innerHeight;
    const p   = max > 0 ? window.scrollY / max : 0;
    progress.style.width = (p * 100) + '%';

    if (p > 0.02) hint.style.opacity = '0';
    else          hint.style.opacity = '1';

    // 0.00 - 0.10 : stelle e luna appaiono
    const tStars = map(p, 0.00, 0.10);
    stars.style.opacity = tStars.toString();
    moon.style.opacity  = tStars.toString();
    moon.style.transform = `scale(${lerp(0.6, 1, tStars)})`;

    // 0.05 - 0.20 : colline emergono
    const tHills = map(p, 0.05, 0.20);
    hillL.style.opacity = tHills.toString();
    hillR.style.opacity = tHills.toString();
    hillL.style.transform = `translateY(${lerp(40, 0, tHills)}px)`;
    hillR.style.transform = `translateY(${lerp(50, 0, tHills)}px)`;

    // 0.10 - 0.25 : terreno sale
    const tGround = map(p, 0.10, 0.25);
    ground.style.transform = `translateY(${lerp(100, 0, tGround)}%)`;

    // 0.18 - 0.32 : casetta entra
    const tHouse = map(p, 0.18, 0.32);
    house.style.opacity   = tHouse.toString();
    house.style.transform = `translateY(${lerp(20, 0, tHouse)}px)`;

    // 0.20 - 0.40 : neve aumenta
    snow.style.opacity = map(p, 0.20, 0.40).toString();

    // 0.25 - 0.45 : albero cresce
    const tTree = map(p, 0.25, 0.45);
    const ease  = tTree * tTree * (3 - 2 * tTree); // smoothstep
    tree.style.transform = `translateX(-50%) scale(${ease})`;

    // 0.45 - 0.65 : decorazioni (baubles) appaiono in sequenza
    const tDeco = map(p, 0.45, 0.65);
    baubles.forEach(b => {
      const delay = parseFloat(b.dataset.delay);
      const local = clamp((tDeco - delay * 0.7) / 0.3);
      b.style.opacity = local.toString();
      b.style.transform = `scale(${lerp(0, 1, local)})`;
    });

    // 0.60 - 0.78 : luci si accendono
    const tLights = map(p, 0.60, 0.78);
    lights.forEach(l => {
      const delay = parseFloat(l.dataset.delay);
      const local = clamp((tLights - delay * 0.6) / 0.4);
      // pulsazione leggera quando accese
      const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 400 + delay * 6);
      l.style.opacity = (local * pulse).toString();
    });

    // 0.72 - 0.85 : stella sull'albero
    const tStar = map(p, 0.72, 0.85);
    const starEase = tStar * tStar * (3 - 2 * tStar);
    star.style.transform =
      `translate(-50%, -50%) scale(${lerp(0, 1, starEase)}) rotate(${lerp(-180, 0, starEase)}deg)`;

    // 0.78 - 1.00 : slitta attraversa il cielo
    const tSleigh = map(p, 0.78, 1.00);
    const arc = -Math.sin(tSleigh * Math.PI) * 60;
    sleigh.style.opacity   = (tSleigh > 0 && tSleigh < 1 ? 1 : 0).toString();
    sleigh.style.transform =
      `translate(${lerp(0, window.innerWidth * 1.5, tSleigh)}px, ${arc}px)`;

    // 0.88 - 1.00 : auguri
    const tGreet = map(p, 0.88, 1.00);
    greet.style.opacity = tGreet.toString();
    greet.style.transform = `translate(-50%, 0) scale(${lerp(0.9, 1, tGreet)})`;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
