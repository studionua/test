<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartoline · Camigliatello Silano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #F9F6EF;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Riga orizzontale di tre cartoline */
    .row {
      display: flex;
      gap: clamp(16px, 3vw, 48px);
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ---- Scena 3D ----
       Aspect-ratio esatto dell'immagine (316×509) così la cartolina
       non viene mai ritagliata, e `object-fit: contain` la preserva
       integrale. */
    .scene {
      width: min(30vw, 316px);
      min-width: 240px;
      aspect-ratio: 316 / 509;
      perspective: 1600px;
    }

    /* ---- Mobile: carosello scorrevole, una card alla volta ---- */
    @media (max-width: 768px) {
      html, body {
        display: block;
        padding: 0;
        overflow-x: hidden;
      }

      .row {
        flex-wrap: nowrap;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        padding: 40px calc(50vw - 158px);  /* 158 = metà card */
        gap: 32px;
        justify-content: flex-start;
        scrollbar-width: none;
      }
      .row::-webkit-scrollbar { display: none; }

      .scene {
        flex: 0 0 auto;
        width: 316px;
        min-width: 316px;
        scroll-snap-align: center;
      }
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      cursor: pointer;
      transition: transform 1.2s cubic-bezier(0.55, 0.1, 0.35, 1);
      will-change: transform;
    }

    /* Flip solo al click */
    .scene.flipped .card { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .face img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .front { transform: rotateY(0deg)   translateZ(1px); }
    .back  { transform: rotateY(180deg) translateZ(1px); }

    /* ---- Scritta a mano sulle righe del retro ---- */
    .handwriting {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .handwriting .line {
      position: absolute;
      left: 8%;
      right: 4%;
      height: 22px;
      line-height: 22px;
      font-family: 'Caveat', cursive;
      font-size: 17px;
      color: #ece7d3;
      white-space: nowrap;
      overflow: hidden;
      letter-spacing: 0.2px;
    }

    .handwriting .line:nth-child(1) { top: 49.5%; transform: rotate(-0.6deg); }
    .handwriting .line:nth-child(2) { top: 59.3%; transform: rotate(0.4deg); }
    .handwriting .line:nth-child(3) { top: 67.4%; transform: rotate(-0.3deg); }
    .handwriting .line:nth-child(4) { top: 76.5%; transform: rotate(0.5deg); }

    .hint {
      position: fixed;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #5a5a4f;
      opacity: 0.7;
    }

    /* ---- Neve: canvas full-viewport + toggle ---- */
    #snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    body.snowing #snow { opacity: 1; }

    .snow-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid #2b3321;
      background: #F9F6EF;
      color: #2b3321;
      font-size: 22px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.4s ease, background 0.3s ease, color 0.3s ease;
      z-index: 20;
      user-select: none;
    }
    .snow-toggle:hover { transform: scale(1.08); }
    body.snowing .snow-toggle {
      background: #2b3321;
      color: #F9F6EF;
      animation: spin 6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="row">

    <div class="scene">
      <div class="card">
        <div class="face front">
          <img src="de-giuseppe/la%20suite.png" alt="Fronte cartolina 1" />
        </div>
        <div class="face back">
          <img src="de-giuseppe/PROVA%20CARTOLINA2.png" alt="Retro cartolina 1" />
          <div class="handwriting">
            <div class="line" data-text="Camera con ampi spazi per esigenze"></div>
            <div class="line" data-text="familiari o di coppie in cerca di"></div>
            <div class="line" data-text="un vero e proprio spazio da vivere"></div>
            <div class="line" data-text="in piena libertà."></div>
          </div>
        </div>
      </div>
    </div>

    <div class="scene">
      <div class="card">
        <div class="face front">
          <img src="de-giuseppe/la_standard.png" alt="Fronte Standard" />
        </div>
        <div class="face back">
          <img src="de-giuseppe/la_standardretro.png" alt="Retro Standard" />
          <div class="handwriting">
            <div class="line" data-text="Camera adatta alle coppie che vogliono"></div>
            <div class="line" data-text="vivere il tempo della vacanza con la"></div>
            <div class="line" data-text="vita della Sila e godendo nei momenti"></div>
            <div class="line" data-text="di Relax gli spazi comuni della struttura."></div>
          </div>
        </div>
      </div>
    </div>

    <div class="scene">
      <div class="card">
        <div class="face front">
          <img src="de-giuseppe/la_deluxe.png" alt="Fronte Deluxe" />
        </div>
        <div class="face back">
          <img src="de-giuseppe/la_deluxeretro.png" alt="Retro Deluxe" />
          <div class="handwriting">
            <div class="line" data-text="Camera con spazi adatti ad una coppia"></div>
            <div class="line" data-text="esigente e che vuole ritrovare la"></div>
            <div class="line" data-text="serenità e il relax, vivendo qualche"></div>
            <div class="line" data-text="momento in più il proprio appartamento."></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <canvas id="snow"></canvas>
  <button class="snow-toggle" id="snowToggle" aria-label="Attiva neve" title="Neve">&#10052;</button>

  <div class="hint">clicca su una cartolina</div>

  <script>
    /* ---- Parametri scrittura ---- */
    const CHAR_MS     = 55;
    const CHAR_JITTER = 40;
    const SPACE_PAUSE = 90;
    const LINE_PAUSE  = 420;
    const START_DELAY = 700;

    const rand = (a, b) => a + Math.random() * (b - a);
    const wait = ms => new Promise(r => setTimeout(r, ms));

    /* ===========================================================
       AUDIO – Web Audio API
       - playPen(): suono di penna su carta, sintetizzato con
         noise filtrato + sub-tono basso + envelope a colpo.
       - playBell(): campanellina inarmonica molto breve, con
         più armoniche e piccola coda riverberata.
       =========================================================== */
    let audioCtx = null;
    let masterGain = null;
    let convolver = null;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      /* Volume master */
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.9;
      masterGain.connect(audioCtx.destination);

      /* Piccolo riverbero (impulse response sintetizzato) */
      const irLen = audioCtx.sampleRate * 0.6;
      const ir    = audioCtx.createBuffer(2, irLen, audioCtx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = ir.getChannelData(c);
        for (let i = 0; i < irLen; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 2.4);
        }
      }
      convolver = audioCtx.createConvolver();
      convolver.buffer = ir;
      const wet = audioCtx.createGain();
      wet.gain.value = 0.25;
      convolver.connect(wet).connect(masterGain);
    }

    async function ensureAudioRunning() {
      initAudio();
      if (audioCtx.state === 'suspended') {
        try { await audioCtx.resume(); } catch(e) {}
      }
    }

    /* Precalcola un buffer di noise */
    let _noise = null;
    function noiseBuffer() {
      if (_noise) return _noise;
      const len = audioCtx.sampleRate * 0.3;
      _noise = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const d = _noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return _noise;
    }

    /* ---- Penna su carta ---- */
    function playPen() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      /* Rumore filtrato: corpo acuto del graffio */
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuffer();
      src.playbackRate.value = 0.75 + Math.random() * 0.5;

      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 2600 + Math.random() * 2200;
      bp.Q.value = 1.4;

      const hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 1100;

      const g = audioCtx.createGain();
      const dur  = 0.028 + Math.random() * 0.03;
      const peak = 0.12 + Math.random() * 0.06;
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(peak, now + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0005, now + dur);

      src.connect(bp).connect(hp).connect(g);
      g.connect(masterGain);
      g.connect(convolver);
      src.start(now);
      src.stop(now + dur + 0.05);

      /* Piccolo "tap" sub-tonale per dare corpo al colpo */
      const thump = audioCtx.createOscillator();
      const tg    = audioCtx.createGain();
      thump.type  = 'triangle';
      thump.frequency.setValueAtTime(180 + Math.random() * 60, now);
      thump.frequency.exponentialRampToValueAtTime(60, now + 0.05);
      tg.gain.setValueAtTime(0, now);
      tg.gain.linearRampToValueAtTime(0.04, now + 0.002);
      tg.gain.exponentialRampToValueAtTime(0.0005, now + 0.05);
      thump.connect(tg).connect(masterGain);
      thump.start(now);
      thump.stop(now + 0.07);
    }

    /* ---- Campanellina: inarmonica, brevissima, cristallina ---- */
    function playBell() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      /* Frequenze inarmoniche tipiche di una piccola campanella */
      const partials = [
        { f: 1760, amp: 0.22, decay: 0.42 },
        { f: 2640, amp: 0.14, decay: 0.28 },
        { f: 3520, amp: 0.10, decay: 0.22 },
        { f: 4620, amp: 0.07, decay: 0.16 },
        { f: 880,  amp: 0.06, decay: 0.55 }
      ];

      const out = audioCtx.createGain();
      out.gain.value = 0.9;
      out.connect(masterGain);
      out.connect(convolver);

      partials.forEach((p, i) => {
        const osc = audioCtx.createOscillator();
        osc.type  = 'sine';
        osc.frequency.value = p.f * (1 + (Math.random() - 0.5) * 0.004);

        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(p.amp, now + 0.003 + i * 0.001);
        g.gain.exponentialRampToValueAtTime(0.0005, now + p.decay);

        osc.connect(g).connect(out);
        osc.start(now);
        osc.stop(now + p.decay + 0.05);
      });

      /* Piccolo "ping" iniziale, rumore molto breve filtrato alto */
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuffer();
      const hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 3500;
      const pg = audioCtx.createGain();
      pg.gain.setValueAtTime(0, now);
      pg.gain.linearRampToValueAtTime(0.18, now + 0.002);
      pg.gain.exponentialRampToValueAtTime(0.0005, now + 0.04);
      src.connect(hp).connect(pg).connect(masterGain);
      src.start(now);
      src.stop(now + 0.06);
    }

    /* Inizializza ogni cartolina in modo indipendente */
    document.querySelectorAll('.scene').forEach((scene) => {
      const lines = scene.querySelectorAll('.handwriting .line');
      let writeToken = 0;

      const resetLines = () => lines.forEach(l => { l.textContent = ''; });

      async function writeAll() {
        const myToken = ++writeToken;
        resetLines();
        await wait(START_DELAY);
        if (myToken !== writeToken) return;

        for (const line of lines) {
          const text = line.dataset.text;
          line.textContent = '';

          for (let i = 0; i < text.length; i++) {
            const ch = text[i];
            line.textContent += ch;
            if (ch !== ' ') playPen();
            let delay = CHAR_MS + rand(-CHAR_JITTER, CHAR_JITTER);
            if (ch === ' ' || ch === ',' || ch === '.') delay += SPACE_PAUSE;
            await wait(delay);
            if (myToken !== writeToken) return;
          }
          await wait(LINE_PAUSE);
          if (myToken !== writeToken) return;
        }
      }

      scene.addEventListener('click', async () => {
        await ensureAudioRunning();
        scene.classList.toggle('flipped');
        if (scene.classList.contains('flipped')) {
          playBell();
          writeAll();
        }
      });
    });

    /* ===========================================================
       NEVE – canvas con fiocchi sinusoidali, toggleabile
       =========================================================== */
    (function snowModule() {
      const canvas = document.getElementById('snow');
      const ctx    = canvas.getContext('2d');
      const toggle = document.getElementById('snowToggle');

      let W, H, DPR, active = false, flakes = [];

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width  = W * DPR;
        canvas.height = H * DPR;
        canvas.style.width  = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      const COUNT = Math.max(80, Math.floor(W * H / 14000));

      function makeFlake(top = false) {
        const r = 1 + Math.random() * 2.8;
        return {
          x: Math.random() * W,
          y: top ? -20 - Math.random() * H : Math.random() * H,
          r,
          vy: 0.3 + r * 0.35,        /* più grande = più veloce */
          vxAmp: 0.4 + Math.random() * 0.9,
          phase: Math.random() * Math.PI * 2,
          omega: 0.004 + Math.random() * 0.008,
          alpha: 0.55 + Math.random() * 0.45
        };
      }

      for (let i = 0; i < COUNT; i++) flakes.push(makeFlake(false));

      function frame() {
        ctx.clearRect(0, 0, W, H);
        if (active) {
          for (const f of flakes) {
            f.phase += f.omega;
            f.x += Math.sin(f.phase) * f.vxAmp * 0.6;
            f.y += f.vy;
            if (f.y > H + 10) { Object.assign(f, makeFlake(true)); }
            if (f.x < -10) f.x = W + 10;
            if (f.x > W + 10) f.x = -10;

            ctx.beginPath();
            ctx.fillStyle = `rgba(255,255,255,${f.alpha})`;
            ctx.shadowColor = 'rgba(255,255,255,0.6)';
            ctx.shadowBlur  = 4;
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.shadowBlur = 0;
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      toggle.addEventListener('click', () => {
        active = !active;
        document.body.classList.toggle('snowing', active);
      });
    })();
  </script>
</body>
</html>
