<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartoline · Camigliatello Silano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #F9F6EF;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Riga orizzontale di tre cartoline */
    .row {
      display: flex;
      gap: clamp(16px, 3vw, 48px);
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ---- Scena 3D ----
       Aspect-ratio esatto dell'immagine (316×509) così la cartolina
       non viene mai ritagliata, e `object-fit: contain` la preserva
       integrale. */
    .scene {
      width: min(30vw, 316px);
      min-width: 240px;
      aspect-ratio: 316 / 509;
      perspective: 1600px;
    }

    /* ---- Mobile: carosello scorrevole, una card alla volta ---- */
    @media (max-width: 768px) {
      html, body {
        display: block;
        padding: 0;
        overflow-x: hidden;
      }

      .row {
        flex-wrap: nowrap;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        padding: 40px calc(50vw - 158px);  /* 158 = metà card */
        gap: 32px;
        justify-content: flex-start;
        scrollbar-width: none;
      }
      .row::-webkit-scrollbar { display: none; }

      .scene {
        flex: 0 0 auto;
        width: 316px;
        min-width: 316px;
        scroll-snap-align: center;
      }

      /* Icona neve: sul mobile evita di sovrapporsi alle card:
         spostala in basso a destra con più margine. */
      .snow-toggle {
        top: auto;
        bottom: 24px;
        right: 18px;
        width: 42px;
        height: 42px;
        font-size: 20px;
      }

      .hint { bottom: 78px; }
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      cursor: pointer;
      transition: transform 1.2s cubic-bezier(0.55, 0.1, 0.35, 1);
      will-change: transform;
    }

    /* Flip solo al click */
    .scene.flipped .card { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .face img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .front { transform: rotateY(0deg)   translateZ(1px); }
    .back  { transform: rotateY(180deg) translateZ(1px); }

    /* ---- Scritta a mano sulle righe del retro ---- */
    .handwriting {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .handwriting .line {
      position: absolute;
      left: 8%;
      right: 4%;
      height: 22px;
      line-height: 22px;
      font-family: 'Caveat', cursive;
      font-size: 17px;
      color: #ece7d3;
      white-space: nowrap;
      overflow: hidden;
      letter-spacing: 0.2px;
    }

    .handwriting .line:nth-child(1) { top: 49.5%; transform: rotate(-0.6deg); }
    .handwriting .line:nth-child(2) { top: 59.3%; transform: rotate(0.4deg); }
    .handwriting .line:nth-child(3) { top: 67.4%; transform: rotate(-0.3deg); }
    .handwriting .line:nth-child(4) { top: 76.5%; transform: rotate(0.5deg); }

    /* Deluxe: testo in verde scuro invece del crema */
    .scene.deluxe .handwriting .line { color: #2A331C; }

    .hint {
      position: fixed;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #5a5a4f;
      opacity: 0.7;
    }

    /* ---- Neve: canvas full-viewport + toggle ---- */
    #snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    body.snowing #snow { opacity: 1; }

    .snow-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid #2b3321;
      background: #F9F6EF;
      color: #2b3321;
      font-size: 22px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.4s ease, background 0.3s ease, color 0.3s ease;
      z-index: 20;
      user-select: none;
    }
    .snow-toggle:hover { transform: scale(1.08); }
    body.snowing .snow-toggle {
      background: #2b3321;
      color: #F9F6EF;
      animation: spin 6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="row">

    <div class="scene">
      <div class="card">
        <div class="face front">
          <img src="de-giuseppe/la%20suite.png" alt="Fronte cartolina 1" />
        </div>
        <div class="face back">
          <img src="de-giuseppe/PROVA%20CARTOLINA2.png" alt="Retro cartolina 1" />
          <div class="handwriting">
            <div class="line" data-text="Camera con ampi spazi per esigenze"></div>
            <div class="line" data-text="familiari o di coppie in cerca di"></div>
            <div class="line" data-text="un vero e proprio spazio da vivere"></div>
            <div class="line" data-text="in piena libertà."></div>
          </div>
        </div>
      </div>
    </div>

    <div class="scene">
      <div class="card">
        <div class="face front">
          <img src="de-giuseppe/la_standard.png" alt="Fronte Standard" />
        </div>
        <div class="face back">
          <img src="de-giuseppe/la_standardretro.png" alt="Retro Standard" />
          <div class="handwriting">
            <div class="line" data-text="Camera adatta alle coppie che vogliono"></div>
            <div class="line" data-text="vivere il tempo della vacanza con la"></div>
            <div class="line" data-text="vita della Sila e godendo nei momenti"></div>
            <div class="line" data-text="di Relax gli spazi comuni della struttura."></div>
          </div>
        </div>
      </div>
    </div>

    <div class="scene deluxe">
      <div class="card">
        <div class="face front">
          <img src="de-giuseppe/la_deluxe.png" alt="Fronte Deluxe" />
        </div>
        <div class="face back">
          <img src="de-giuseppe/la_deluxeretro.png" alt="Retro Deluxe" />
          <div class="handwriting">
            <div class="line" data-text="Camera con spazi adatti ad una coppia"></div>
            <div class="line" data-text="esigente e che vuole ritrovare la"></div>
            <div class="line" data-text="serenità e il relax, vivendo qualche"></div>
            <div class="line" data-text="momento in più il proprio appartamento."></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <canvas id="snow"></canvas>
  <button class="snow-toggle" id="snowToggle" aria-label="Attiva neve" title="Neve">&#10052;</button>

  <div class="hint">clicca su una cartolina</div>

  <script>
    /* ---- Parametri scrittura ---- */
    const CHAR_MS     = 55;
    const CHAR_JITTER = 40;
    const SPACE_PAUSE = 90;
    const LINE_PAUSE  = 420;
    const START_DELAY = 700;

    const rand = (a, b) => a + Math.random() * (b - a);
    const wait = ms => new Promise(r => setTimeout(r, ms));

    /* ===========================================================
       AUDIO – sample reali
       - penna: loop continuo durante la scrittura
       - campanelle: one-shot al flip
       =========================================================== */
    const pencilAudio = new Audio('de-giuseppe/floraphonic-pencil-writing-drawing-loop-5-211896.mp3');
    pencilAudio.loop   = true;
    pencilAudio.volume = 0.8;
    pencilAudio.preload = 'auto';

    const bellsAudio = new Audio('de-giuseppe/dragon-studio-bells-jingling-2-372467.mp3');
    bellsAudio.volume = 0.9;
    bellsAudio.preload = 'auto';

    let pencilActive = 0; /* contatore: così più cartoline in scrittura non si pestano */

    function pencilStart() {
      pencilActive++;
      if (pencilActive === 1) {
        try {
          pencilAudio.currentTime = 0;
          pencilAudio.play();
        } catch(e) {}
      }
    }

    function pencilStop() {
      pencilActive = Math.max(0, pencilActive - 1);
      if (pencilActive === 0) {
        /* fade out morbido per evitare click di fine loop */
        const start = pencilAudio.volume;
        const steps = 10;
        let i = 0;
        const id = setInterval(() => {
          i++;
          pencilAudio.volume = Math.max(0, start * (1 - i / steps));
          if (i >= steps) {
            clearInterval(id);
            pencilAudio.pause();
            pencilAudio.currentTime = 0;
            pencilAudio.volume = start;
          }
        }, 25);
      }
    }

    function playBell() {
      try {
        /* clone per consentire flip ravvicinati sovrapposti */
        const b = bellsAudio.cloneNode();
        b.volume = bellsAudio.volume;
        b.play();
      } catch(e) {}
    }

    async function ensureAudioRunning() {
      /* L'interazione utente (click) basta a sbloccare l'autoplay */
    }

    /* Inizializza ogni cartolina in modo indipendente */
    document.querySelectorAll('.scene').forEach((scene) => {
      const lines = scene.querySelectorAll('.handwriting .line');
      let writeToken = 0;

      const resetLines = () => lines.forEach(l => { l.textContent = ''; });

      async function writeAll() {
        const myToken = ++writeToken;
        resetLines();
        await wait(START_DELAY);
        if (myToken !== writeToken) return;

        pencilStart();
        try {
          for (const line of lines) {
            const text = line.dataset.text;
            line.textContent = '';

            for (let i = 0; i < text.length; i++) {
              const ch = text[i];
              line.textContent += ch;
              let delay = CHAR_MS + rand(-CHAR_JITTER, CHAR_JITTER);
              if (ch === ' ' || ch === ',' || ch === '.') delay += SPACE_PAUSE;
              await wait(delay);
              if (myToken !== writeToken) return;
            }
            await wait(LINE_PAUSE);
            if (myToken !== writeToken) return;
          }
        } finally {
          pencilStop();
        }
      }

      scene.addEventListener('click', async () => {
        await ensureAudioRunning();
        const wasFlipped = scene.classList.contains('flipped');
        scene.classList.toggle('flipped');

        if (!wasFlipped) {
          /* Verso il retro: bell + scrittura */
          playBell();
          writeAll();
        } else {
          /* Torno al fronte mentre sto scrivendo: annulla il loop
             di scrittura in corso. L'audio penna si ferma dal `finally`
             della writeAll (fade-out morbido). */
          writeToken++;
        }
      });
    });

    /* ===========================================================
       NEVE – fiocchi + accumulo sul bordo superiore delle card
       =========================================================== */
    (function snowModule() {
      const canvas = document.getElementById('snow');
      const ctx    = canvas.getContext('2d');
      const toggle = document.getElementById('snowToggle');

      let W, H, DPR, active = false;
      const flakes = [];
      const BIN = 3;                 /* larghezza in px di ogni colonna di neve */
      const MAX_PILE = 14;           /* altezza massima dell'accumulo in px */
      const cards = Array.from(document.querySelectorAll('.scene'));
      const piles = cards.map(() => ({ bins: [], top: 0, left: 0, width: 0 }));

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width  = W * DPR;
        canvas.height = H * DPR;
        canvas.style.width  = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        measurePiles(true);
      }

      function measurePiles(keep) {
        cards.forEach((scene, i) => {
          const r = scene.getBoundingClientRect();
          const p = piles[i];
          p.top   = r.top;
          p.left  = r.left;
          p.width = r.width;
          const n = Math.max(1, Math.ceil(r.width / BIN));
          if (!keep || p.bins.length !== n) p.bins = new Array(n).fill(0);
        });
      }

      window.addEventListener('resize', resize);
      window.addEventListener('scroll', () => measurePiles(true), { passive: true });
      resize();

      const COUNT = Math.max(80, Math.floor(W * H / 14000));

      function makeFlake(fromTop = false) {
        const r = 1 + Math.random() * 2.8;
        return {
          x: Math.random() * W,
          y: fromTop ? -20 - Math.random() * 80 : Math.random() * H,
          r,
          vy: 0.3 + r * 0.35,
          vxAmp: 0.4 + Math.random() * 0.9,
          phase: Math.random() * Math.PI * 2,
          omega: 0.004 + Math.random() * 0.008,
          alpha: 0.55 + Math.random() * 0.45
        };
      }

      for (let i = 0; i < COUNT; i++) flakes.push(makeFlake(false));

      /* Verifica collisione di un fiocco con una pila:
         se tocca il bordo superiore della card, viene assorbito
         e la bin corrispondente cresce. */
      function collide(f) {
        for (const p of piles) {
          if (p.width === 0) continue;
          if (f.x < p.left || f.x > p.left + p.width) continue;
          const bin = Math.max(0, Math.min(p.bins.length - 1, Math.floor((f.x - p.left) / BIN)));
          const surfaceY = p.top - p.bins[bin];
          if (f.y >= surfaceY && f.y <= surfaceY + 20) {
            /* aggiungi al mucchietto + distribuzione ai vicini */
            p.bins[bin] = Math.min(MAX_PILE, p.bins[bin] + 0.45);
            if (bin > 0) p.bins[bin - 1] = Math.min(MAX_PILE, p.bins[bin - 1] + 0.18);
            if (bin < p.bins.length - 1) p.bins[bin + 1] = Math.min(MAX_PILE, p.bins[bin + 1] + 0.18);
            return true;
          }
        }
        return false;
      }

      function drawPiles() {
        ctx.fillStyle   = 'rgba(255,255,255,0.95)';
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth   = 1;
        for (const p of piles) {
          if (p.width === 0) continue;
          ctx.beginPath();
          ctx.moveTo(p.left, p.top + 1);
          for (let i = 0; i < p.bins.length; i++) {
            const x = p.left + i * BIN + BIN / 2;
            const y = p.top - p.bins[i];
            ctx.lineTo(x, y);
          }
          ctx.lineTo(p.left + p.width, p.top + 1);
          ctx.closePath();
          ctx.fill();
        }
      }

      function frame() {
        ctx.clearRect(0, 0, W, H);
        /* Sempre visibile: la neve accumulata resta anche a neve spenta */
        drawPiles();

        if (active) {
          for (const f of flakes) {
            f.phase += f.omega;
            f.x += Math.sin(f.phase) * f.vxAmp * 0.6;
            f.y += f.vy;

            if (collide(f)) {
              Object.assign(f, makeFlake(true));
              continue;
            }
            if (f.y > H + 10) { Object.assign(f, makeFlake(true)); continue; }
            if (f.x < -10) f.x = W + 10;
            if (f.x > W + 10) f.x = -10;

            ctx.beginPath();
            ctx.fillStyle = `rgba(255,255,255,${f.alpha})`;
            ctx.shadowColor = 'rgba(255,255,255,0.6)';
            ctx.shadowBlur  = 4;
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.shadowBlur = 0;
        }

        /* Ri-misura periodicamente per seguire eventuali spostamenti */
        if ((frame.count = (frame.count || 0) + 1) % 30 === 0) measurePiles(true);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      toggle.addEventListener('click', () => {
        active = !active;
        document.body.classList.toggle('snowing', active);
        /* Reset accumulo se spegni la neve */
        if (!active) piles.forEach(p => p.bins.fill(0));
      });
    })();
  </script>
</body>
</html>
