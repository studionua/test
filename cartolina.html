<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartolina · Camigliatello Silano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #e8e4d8;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ---- Scena 3D ----
       Aspect-ratio esatto dell'immagine (316×509) così la cartolina
       non viene mai ritagliata, e `object-fit: contain` la preserva
       integrale. */
    .scene {
      width: min(90vw, 316px);
      aspect-ratio: 316 / 509;
      perspective: 1600px;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      cursor: pointer;
      transition: transform 1.2s cubic-bezier(0.55, 0.1, 0.35, 1);
      will-change: transform;
    }

    /* Flip solo al click */
    .scene.flipped .card { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .face img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .front { transform: rotateY(0deg)   translateZ(1px); }
    .back  { transform: rotateY(180deg) translateZ(1px); }

    /* ---- Scritta a mano sulle righe del retro ----
       Ogni riga è posizionata in assoluto (percentuali) così il testo
       non si sposta mai mentre le altre righe vengono composte. */
    .handwriting {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .handwriting .line {
      position: absolute;
      left: 11%;
      right: 11%;
      height: 22px;           /* altezza fissa: niente assestamenti */
      line-height: 22px;
      font-family: 'Caveat', cursive;
      font-size: 22px;
      color: #ece7d3;
      white-space: nowrap;
      overflow: hidden;
      letter-spacing: 0.3px;
    }

    /* Posizione di ogni riga: il baseline del testo cade poco sopra
       la riga stampata sulla cartolina. */
    .handwriting .line:nth-child(1) { top: 49.5%; transform: rotate(-0.6deg); }
    .handwriting .line:nth-child(2) { top: 59.3%; transform: rotate(0.4deg); }
    .handwriting .line:nth-child(3) { top: 67.4%; transform: rotate(-0.3deg); }
    .handwriting .line:nth-child(4) { top: 76.5%; transform: rotate(0.5deg); }

    .hint {
      position: fixed;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #5a5a4f;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="scene" id="scene">
    <div class="card">
      <div class="face front">
        <img src="de-giuseppe/PROVA%20CARTOLINA1.png" alt="Fronte cartolina" />
      </div>
      <div class="face back">
        <img src="de-giuseppe/PROVA%20CARTOLINA2.png" alt="Retro cartolina" />
        <div class="handwriting" id="handwriting">
          <div class="line" data-text="Spazi ampi con esigenze familiari"></div>
          <div class="line" data-text="o di coppie in cerca di un vero"></div>
          <div class="line" data-text="e proprio spazio da vivere"></div>
          <div class="line" data-text="in piena libertà."></div>
        </div>
      </div>
    </div>
  </div>

  <div class="hint">clicca sulla cartolina</div>

  <script>
    const scene = document.getElementById('scene');
    const lines = document.querySelectorAll('#handwriting .line');

    /* ---- Scrittura progressiva ---- */
    const CHAR_MS     = 55;
    const CHAR_JITTER = 40;
    const SPACE_PAUSE = 90;
    const LINE_PAUSE  = 420;
    const START_DELAY = 700; /* parte dopo che la cartolina ha quasi finito il flip */

    const rand = (a, b) => a + Math.random() * (b - a);
    const wait = ms => new Promise(r => setTimeout(r, ms));

    /* Token per annullare una scrittura in corso se l'utente rigira la cartolina */
    let writeToken = 0;

    function resetLines() {
      lines.forEach(l => {
        l.textContent = '';
        l.classList.remove('writing');
      });
    }

    async function writeAll() {
      const myToken = ++writeToken;
      resetLines();
      await wait(START_DELAY);
      if (myToken !== writeToken) return;

      for (const line of lines) {
        const text = line.dataset.text;
        line.textContent = '';
        line.classList.add('writing');

        for (let i = 0; i < text.length; i++) {
          line.textContent += text[i];
          let delay = CHAR_MS + rand(-CHAR_JITTER, CHAR_JITTER);
          const ch = text[i];
          if (ch === ' ' || ch === ',' || ch === '.') delay += SPACE_PAUSE;
          await wait(delay);
          if (myToken !== writeToken) { line.classList.remove('writing'); return; }
        }

        line.classList.remove('writing');
        await wait(LINE_PAUSE);
        if (myToken !== writeToken) return;
      }
    }

    /* Click: gira la cartolina. Ogni volta che si arriva al retro
       la scrittura riparte da zero. Quando si torna al fronte il
       testo resta: non viene ripulito, resta impresso sul retro. */
    scene.addEventListener('click', () => {
      scene.classList.toggle('flipped');
      if (scene.classList.contains('flipped')) {
        writeAll();
      }
    });
  </script>
</body>
</html>
